# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: bazzite-omen-kde
description: This is my personal OS image.

base-image: ghcr.io/ublue-os/bazzite-nvidia-open
image-version: stable

modules:

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.heroicgameslauncher.hgl
          - org.onlyoffice.desktopeditors

  - type: dnf
    repos:
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
        - https://copr.fedorainfracloud.org/coprs/deltacopy/darkly/repo/fedora-45/deltacopy-darkly-fedora-45.repo
    install:
      packages:
        - git
        - gcc
        - make
        - dkms
        - kernel-devel
        - mc
        - python3-pyqt6
        - python3-pyside6
        - python3-tkinter
        - python3-send2trash
        - python3-psutil
        - brave-browser
        - darkly
        - easyeffects

  - type: files
    files:
      - source: system
        destination: /

  - type: signing
